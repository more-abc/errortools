repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    # all
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-symlinks
      - id: check-added-large-files

      # python
      - id: check-builtin-literals
        exclude: ^testing/data/errongreat/
      - id: check-builtin-literals
        exclude: ^testing/data/errongreat/
      - id: check-ast
        exclude: ^testing/data/errongreat/

      # config files
      - id: check-yaml
      - id: check-json
      - id: check-toml

      # pytest only
      - id: name-tests-test
